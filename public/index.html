      /* ---------- AliRTC ---------- */
      async function joinAliRtc() {
        if (!window.AliRtcEngine) {
          throw new Error(t("error.sdkNotLoaded"));
        }
        const checkResult = await window.AliRtcEngine.isSupported();
        if (!checkResult.support) {
          throw new Error(t("error.browserUnsupported", { reason: checkResult.reason || "unknown" }));
        }

        window.AliRtcEngine.setLogLevel(0);
        state.aliRtcEngine = window.AliRtcEngine.getInstance();
        listenAliRtcEvents(state.aliRtcEngine);
        const useUploadedVideo = isUploadedVideoSelected();
        const useSegmentation = isSegmentationEnabled();
        await callOptionalEngineMethod(state.aliRtcEngine, "setChannelProfile", "communication");
        // AliRTC auto-captures before join when publishing is enabled. Disable that
        // path for custom sources so the SDK cannot replace our processed canvas
        // track with the raw camera track.
        await callOptionalEngineMethod(state.aliRtcEngine, "publishLocalAudioStream", !useUploadedVideo);
        await callOptionalEngineMethod(state.aliRtcEngine, "publishLocalVideoStream", !useUploadedVideo && !useSegmentation);
        await callOptionalEngineMethod(state.aliRtcEngine, "setDefaultSubscribeAllRemoteAudioStreams", true);
        await callOptionalEngineMethod(state.aliRtcEngine, "setDefaultSubscribeAllRemoteVideoStreams", true);

        const joinAndPublish = async () => {
          // Web SDK 使用创建返回的 base64 authInfo 字符串入会（与 alirtc/index.html 一致）。
          const displayName = state.rtc.user_id;
          setStatus("#rtcStatus", "status.rtcJoining", "warn");
          log("AliRTC joinChannel", {
            appId: state.rtc.app_id,
            channelId: state.rtc.channel_id,
            userId: state.rtc.user_id,
            tokenType: "base64",
            videoSource: useUploadedVideo ? "file" : "camera",
            segmentation: useSegmentation,
            timestamp: Number(state.rtc.token_expire_at),
          });
          await state.aliRtcEngine.joinChannel(state.rtc.token, displayName);

          try {
            if (useUploadedVideo || useSegmentation) {
              // Enabling publishing here makes AliRTC request its camera track
              // while getUserMedia is intercepted by the wrappers below.
              await callOptionalEngineMethod(state.aliRtcEngine, "publishLocalVideoStream", true);
              const previewStream = useSegmentation ? state.segmentedCaptureStream : state.uploadedCaptureStream;
              if (!previewStream?.getVideoTracks().length) {
                throw new Error(t("error.videoTrackMissing"));
              }
              localPreviewer.pause();
              localPreviewer.removeAttribute("src");
              localPreviewer.srcObject = previewStream;
              await localPreviewer.play();
            } else {
              await callOptionalEngineMethod(state.aliRtcEngine, "setLocalViewConfig", "localPreviewer", 1);
              await callOptionalEngineMethod(state.aliRtcEngine, "startPreview", 1);
              await callOptionalEngineMethod(state.aliRtcEngine, "publishLocalVideoStream", true);
            }
          } catch (error) {
            if (useUploadedVideo || useSegmentation) {
              showNotice(error.message || String(error));
            } else {
              showMediaNotice("camera", error);
            }
            throw error;
          }
          if (!useUploadedVideo) {
            try {
              await callOptionalEngineMethod(state.aliRtcEngine, "publishLocalAudioStream", true);
            } catch (error) {
              showMediaNotice("microphone", error);
              throw error;
            }
          }
        };

        if (useSegmentation) {
          await withSegmentedVideoAsCamera(joinAndPublish);
        } else if (useUploadedVideo) {
          await withUploadedVideoAsCamera(joinAndPublish);
        } else {
          await joinAndPublish();
        }

        setStatus("#rtcStatus", "status.rtcJoined", "ok");
        log(t("log.rtcJoined"));
      }

      async function callOptionalEngineMethod(engine, methodName, ...args) {
        if (typeof engine[methodName] !== "function") {
          return;
        }
        await engine[methodName](...args);
        log(t("log.rtcMethod", { methodName }), { args });
      }

      function listenAliRtcEvents(engine) {
        engine.on("bye", (code) => {
          setStatus("#rtcStatus", "status.rtcBye", "warn", { code });
          log("AliRTC bye", { code });
        });
        engine.on("remoteUserOnLineNotify", (userId, elapsed) => {
          log(t("log.remoteUserOnline"), { userId, elapsed });
        });
        engine.on("remoteUserOffLineNotify", (userId, reason) => {
          log(t("log.remoteUserOffline"), { userId, reason });
          removeRemoteVideo(userId, "camera");
          removeRemoteVideo(userId, "screen");
        });
        engine.on("videoSubscribeStateChanged", (userId, oldState, newState, interval, channelId) => {
          log(t("log.remoteCameraState"), { userId, oldState, newState, interval, channelId });
          handleRemoteVideo(userId, "camera", newState, 1);
        });
        engine.on("screenShareSubscribeStateChanged", (userId, oldState, newState, interval, channelId) => {
          log(t("log.remoteScreenState"), { userId, oldState, newState, interval, channelId });
          handleRemoteVideo(userId, "screen", newState, 2);
        });
        engine.on("authInfoWillExpire", () => log(t("log.authWillExpire")));
        engine.on("authInfoExpired", () => {
          setStatus("#rtcStatus", "status.rtcFailed", "err");
          log(t("log.authExpired"));
        });
      }

      function preferredRecordingMimeType() {
        if (typeof MediaRecorder.isTypeSupported !== "function") {
          return "";
        }
        const candidates = [
          "video/mp4;codecs=avc1.42E01E,mp4a.40.2",
          "video/mp4",
        ];
        return candidates.find((type) => MediaRecorder.isTypeSupported(type)) || "";
      }

      function drawVideoContained(context, video, x, y, width, height) {
        if (!video.videoWidth || !video.videoHeight || video.readyState < HTMLMediaElement.HAVE_CURRENT_DATA) {
          return;
        }
        const scale = Math.min(width / video.videoWidth, height / video.videoHeight);
        const drawWidth = video.videoWidth * scale;
        const drawHeight = video.videoHeight * scale;
        context.drawImage(
          video,
          x + (width - drawWidth) / 2,
          y + (height - drawHeight) / 2,
          drawWidth,
          drawHeight,
        );
      }

      function stopInputDelayBuffer() {
        const buffer = state.inputDelayBuffer;
        if (!buffer) return;
        if (buffer.timer) window.clearTimeout(buffer.timer);
        buffer.frames.length = 0;
        buffer.pool.length = 0;
        state.inputDelayBuffer = undefined;
      }

      function startInputDelayBuffer() {
        stopInputDelayBuffer();
        if (state.activeProvider === "decart" || !$("#syncComparisonRecording").checked) return;

        const frameRate = 30;
        const frameIntervalMs = 1000 / frameRate;
        const buffer = {
          width: 640,
          height: 360,
          frames: [],
          pool: [],
          timer: undefined,
          maxFrames: Math.ceil(recordingInputDelayMs / frameIntervalMs) + 4,
        };
        state.inputDelayBuffer = buffer;

        const captureFrame = () => {
          if (state.inputDelayBuffer !== buffer) return;
          if (localPreviewer.videoWidth && localPreviewer.videoHeight && localPreviewer.readyState >= HTMLMediaElement.HAVE_CURRENT_DATA) {
            let canvas = buffer.pool.pop();
            if (!canvas) {
              canvas = document.createElement("canvas");
              canvas.width = buffer.width;
              canvas.height = buffer.height;
            }
            const context = canvas.getContext("2d", { alpha: false });
            context.fillStyle = "#0b0f16";
            context.fillRect(0, 0, buffer.width, buffer.height);
            drawVideoContained(context, localPreviewer, 0, 0, buffer.width, buffer.height);
            buffer.frames.push({ canvas, capturedAt: performance.now() });
            while (buffer.frames.length > buffer.maxFrames) {
              buffer.pool.push(buffer.frames.shift().canvas);
            }
          }
          buffer.timer = window.setTimeout(captureFrame, frameIntervalMs);
        };
        captureFrame();
      }

      function delayedInputFrame(now = performance.now()) {
        const frames = state.inputDelayBuffer?.frames;
        if (!frames?.length) return undefined;
        const targetTime = now - recordingInputDelayMs;
        for (let index = frames.length - 1; index >= 0; index -= 1) {
          if (frames[index].capturedAt <= targetTime) return frames[index].canvas;
        }
        return frames[0].canvas;
      }

      function drawComparisonFrame(context, remoteVideo) {
        const width = comparisonRecordingCanvas.width;
        const height = comparisonRecordingCanvas.height;
        const panelWidth = width / 2;
        context.fillStyle = "#0b0f16";
        context.fillRect(0, 0, width, height);
        const bufferedInput = delayedInputFrame();
        if (bufferedInput) {
          context.drawImage(bufferedInput, 0, 0, panelWidth, height);
        } else {
          drawVideoContained(context, localPreviewer, 0, 0, panelWidth, height);
        }
        drawVideoContained(context, remoteVideo, panelWidth, 0, panelWidth, height);
        context.fillStyle = "rgba(11, 15, 22, 0.72)";
        context.fillRect(0, 0, panelWidth, 34);
        context.fillRect(panelWidth, 0, panelWidth, 34);
        context.fillStyle = "#ffffff";
        context.font = "600 16px IBM Plex Mono, monospace";
        context.textBaseline = "middle";
        context.fillText(t("recording.input"), 14, 17);
        context.fillText(t("recording.output"), panelWidth + 14, 17);
        context.fillStyle = "rgba(255, 255, 255, 0.35)";
        context.fillRect(panelWidth - 1, 0, 2, height);
      }

      const mediaBunnyCdnUrl = "https://cdn.jsdelivr.net/npm/mediabunny@1.55.4/+esm";

      function loadMediaBunny() {
        if (!state.mediaBunnyModulePromise) {
          state.mediaBunnyModulePromise = import(mediaBunnyCdnUrl).catch((error) => {
            state.mediaBunnyModulePromise = undefined;
            throw error;
          });
        }
        return state.mediaBunnyModulePromise;
      }

      function cleanupComparisonRecording(session) {
        if (session.frameRequest) {
          window.cancelAnimationFrame(session.frameRequest);
          session.frameRequest = undefined;
        }
        if (session.frameTimer) {
          window.clearTimeout(session.frameTimer);
          session.frameTimer = undefined;
        }
        session.stream?.getTracks().forEach((track) => track.stop());
        session.audioTrack?.stop();
      }

      async function startMediaBunnyRecording(session, video) {
        const {
          BufferTarget,
          CanvasSource,
          MediaStreamAudioTrackSource,
          Mp4OutputFormat,
          Output,
          Quality,
        } = await loadMediaBunny();
        if (session.stopRequested) return;

        comparisonRecordingCanvas.width = 1280;
        comparisonRecordingCanvas.height = 360;
        session.context = comparisonRecordingCanvas.getContext("2d", { alpha: false });
        drawComparisonFrame(session.context, video);

        session.target = new BufferTarget();
        session.output = new Output({
          format: new Mp4OutputFormat(),
          target: session.target,
        });
        session.videoSource = new CanvasSource(comparisonRecordingCanvas, {
          codec: "avc",
          quality: new Quality("high"),
        });
        session.output.addVideoTrack(session.videoSource, { frameRate: session.frameRate });

        const remoteAudioTrack = video.srcObject.getAudioTracks()[0];
        if (remoteAudioTrack) {
          session.audioTrack = remoteAudioTrack.clone();
          session.audioSource = new MediaStreamAudioTrackSource(session.audioTrack, {
            codec: "aac",
            quality: new Quality({ bitrate: 128e3 }),
          });
          session.output.addAudioTrack(session.audioSource);
        }

        await session.output.start();
        session.kind = "mediabunny";
        session.mimeType = "video/mp4";
        session.active = true;
        session.audioSource?.errorPromise.catch((error) => {
          log(t("error.recordingFailed"), errorToJson(error));
        });

        const encodeFrame = async () => {
          if (!session.active) return;
          const startedAt = performance.now();
          drawComparisonFrame(session.context, video);
          const timestamp = session.frameIndex / session.frameRate;
          session.frameEncodingPromise = session.videoSource.add(timestamp, 1 / session.frameRate);
          await session.frameEncodingPromise;
          session.frameEncodingPromise = undefined;
          session.frameIndex += 1;
          if (session.active) {
            const delay = Math.max(0, (1000 / session.frameRate) - (performance.now() - startedAt));
            session.frameTimer = window.setTimeout(encodeFrame, delay);
          }
        };
        session.frameTimer = window.setTimeout(encodeFrame, 0);
        log(t("log.recordingStarted"), { encoder: "MediaBunny", mimeType: session.mimeType });
      }

      function startMediaRecorderFallback(session, video) {
        if (typeof window.MediaRecorder !== "function" || typeof comparisonRecordingCanvas.captureStream !== "function") {
          throw new Error(t("error.comparisonRecordingUnsupported"));
        }
        comparisonRecordingCanvas.width = 1280;
        comparisonRecordingCanvas.height = 360;
        const context = comparisonRecordingCanvas.getContext("2d", { alpha: false });
        drawComparisonFrame(context, video);
        session.stream = comparisonRecordingCanvas.captureStream(session.frameRate);
        video.srcObject.getAudioTracks().forEach((track) => session.stream.addTrack(track.clone()));
        const mimeType = preferredRecordingMimeType();
        if (!mimeType) {
          throw new Error("This browser cannot encode MP4 with MediaRecorder.");
        }
        session.recorder = new MediaRecorder(session.stream, mimeType ? { mimeType } : undefined);
        session.kind = "mediarecorder";
        session.chunks = [];
        session.mimeType = session.recorder.mimeType || mimeType;
        const drawFrame = () => {
          drawComparisonFrame(context, video);
          session.frameRequest = window.requestAnimationFrame(drawFrame);
        };
        drawFrame();
        session.stopPromise = new Promise((resolve) => {
          session.recorder.addEventListener("stop", () => {
            session.blob = new Blob(session.chunks, { type: session.mimeType });
            cleanupComparisonRecording(session);
            resolve(session.blob);
          }, { once: true });
        });
        session.recorder.addEventListener("dataavailable", (event) => {
          if (event.data?.size) session.chunks.push(event.data);
        });
        session.recorder.addEventListener("error", (event) => {
          log(t("error.recordingFailed"), errorToJson(event.error || event));
        });
        session.recorder.start(1000);
        log(t("log.recordingStarted"), { encoder: "MediaRecorder fallback", mimeType: session.mimeType });
      }

      async function initializeRemoteRecording(session, video) {
        try {
          await startMediaBunnyRecording(session, video);
        } catch (mediaBunnyError) {
          log("MediaBunny unavailable; using MediaRecorder fallback", errorToJson(mediaBunnyError));
          cleanupComparisonRecording(session);
          session.videoSource?.close();
          session.audioSource?.close();
          try {
            await session.output?.cancel?.();
          } catch (_) {
            // The MediaRecorder fallback can still start after partial encoder setup fails.
          }
          if (!session.stopRequested) startMediaRecorderFallback(session, video);
        }
      }

      function tryStartRemoteRecording(video) {
        if (state.remoteRecording || !(video.srcObject instanceof MediaStream)) return;
        const session = {
          kind: "starting",
          frameRate: 30,
          frameIndex: 0,
          frameTimer: undefined,
          frameEncodingPromise: undefined,
          stopRequested: false,
          active: false,
        };
        state.remoteRecording = session;
        session.readyPromise = initializeRemoteRecording(session, video).catch((error) => {
          if (state.remoteRecording === session) state.remoteRecording = undefined;
          showNotice(`${t("error.recordingFailed")}: ${error.message || String(error)}`);
          log(t("error.recordingFailed"), errorToJson(error));
        });
      }

      function recordingFilename(mimeType) {
        const timestamp = new Date().toISOString().replace(/[:.]/g, "-");
        const liveId = String(state.live?.id || "session").replace(/[^a-zA-Z0-9_-]/g, "-");
        const extension = mimeType.includes("mp4") ? "mp4" : "webm";
        const provider = state.activeProvider || selectedProvider();
        return `${provider}-input-output-${liveId}-${timestamp}.${extension}`;
      }

      function downloadRecording(blob, mimeType) {
        const filename = recordingFilename(mimeType);
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = filename;
        link.style.display = "none";
        document.body.appendChild(link);
        link.click();
        link.remove();
        window.setTimeout(() => URL.revokeObjectURL(url), 1000);
        log(t("log.recordingSaved"), { filename, bytes: blob.size, mimeType });
      }

      async function stopRemoteRecording({ download = false } = {}) {
        const session = state.remoteRecording;
        if (!session) {
          return;
        }
        session.stopRequested = true;
        await session.readyPromise;
        let blob;
        try {
          if (session.kind === "mediabunny") {
            session.active = false;
            cleanupComparisonRecording(session);
            await session.frameEncodingPromise;
            session.videoSource.close();
            session.audioSource?.close();
            await session.output.finalize();
            blob = new Blob([session.target.buffer], { type: session.mimeType });
          } else if (session.kind === "mediarecorder") {
            if (session.recorder.state !== "inactive") session.recorder.stop();
            const stopTimeout = new Promise((resolve) => {
              window.setTimeout(() => resolve(new Blob(session.chunks, { type: session.mimeType })), 2000);
            });
            blob = session.blob || await Promise.race([session.stopPromise, stopTimeout]);
            cleanupComparisonRecording(session);
          }
          if (blob) {
            log(t("log.recordingStopped"), { bytes: blob.size, mimeType: session.mimeType, encoder: session.kind });
            if (download && blob.size) downloadRecording(blob, session.mimeType);
            else if (download) log(t("log.recordingEmpty"));
          }
        } catch (error) {
          showNotice(`${t("error.recordingFailed")}: ${error.message || String(error)}`);
          log(t("error.recordingFailed"), errorToJson(error));
        } finally {
          cleanupComparisonRecording(session);
          if (state.remoteRecording === session) state.remoteRecording = undefined;
        }
      }

      function handleRemoteVideo(userId, kind, newState, streamType) {
        if (newState !== 3) {
          return;
        }
        // 只渲染 render_uid 的摄像头流：即实时编辑合成结果。
        if (userId !== state.renderUid || kind !== "camera") {
          log(t("log.remoteCameraState"), { userId, kind, skipped: true });
          return;
        }
        const key = `${kind}_${userId}`;
        if (state.remoteVideoElMap.has(key)) {
          return;
        }
        const video = document.createElement("video");
        video.autoplay = true;
        video.playsInline = true;
        video.muted = true;
        video.dataset.uid = userId;
        remoteVideoContainer.textContent = "";
        remoteVideoContainer.appendChild(video);
        state.remoteVideoElMap.set(key, video);
        startTimerOnFirstRemoteFrame(video);
        const startRecording = () => tryStartRemoteRecording(video);
        video.addEventListener("loadedmetadata", startRecording, { once: true });
        video.addEventListener("playing", startRecording, { once: true });
        callOptionalEngineMethod(state.aliRtcEngine, "setRemoteViewConfig", video, userId, streamType)
          .then(startRecording)
          .catch((error) => log(t("error.recordingFailed"), errorToJson(error)));
        video.play().catch(() => log(t("log.remoteAutoplayFailed")));
      }

      function removeRemoteVideo(userId, kind) {
        const key = `${kind}_${userId}`;
        const video = state.remoteVideoElMap.get(key);
        if (!video) {
          return;
        }
        video.remove();
        state.remoteVideoElMap.delete(key);
      }

      /* ---------- 会话生命周期 ---------- */
      function setInteractiveEnabled(enabled) {
        switchBtn.disabled = !enabled;
      }

      function setSourceControlsDisabled(disabled) {
        $("#videoSource").disabled = disabled;
        $("#videoFile").disabled = disabled;
        $("#enableSegmentation").disabled = disabled;
        $("#segmentationBackgroundColor").disabled = !isSegmentationEnabled();
        $("#syncComparisonRecording").disabled = disabled || selectedProvider() === "decart";
        document.querySelectorAll('input[name="editingType"]').forEach((input) => {
          input.disabled = disabled;
        });
        document.querySelectorAll('input[name="provider"]').forEach((input) => {
          input.disabled = disabled;
        });
        $("#sessionDuration").disabled = disabled;
      }

      function selectedSessionDurationSeconds() {
        const value = Math.round(Number($("#sessionDuration").value));
        return Math.min(maxSessionDurationSeconds, Math.max(minSessionDurationSeconds, value || 10));
      }

      function updateSessionDurationOutput() {
        const seconds = selectedSessionDurationSeconds();
        $("#sessionDuration").value = String(seconds);
        $("#sessionDurationValue").value = `${seconds} s`;
        $("#sessionDurationValue").textContent = `${seconds} s`;
      }

      function clearAutoHangupTimer() {
        if (state.autoHangupTimer) {
          window.clearTimeout(state.autoHangupTimer);
          state.autoHangupTimer = undefined;
        }
      }

      function scheduleAutoHangup() {
        clearAutoHangupTimer();
        const durationSeconds = selectedSessionDurationSeconds();
        log(t("log.sessionTimerStarted", { durationSeconds }));
        state.autoHangupTimer = window.setTimeout(() => {
          state.autoHangupTimer = undefined;
          log(`${durationSeconds}-second session limit reached; hanging up automatically`);
          hangup().catch((error) => log(t("log.hangupFailed"), errorToJson(error)));
        }, durationSeconds * 1000);
      }

      function startTimerOnFirstRemoteFrame(video) {
        if (state.remoteOutputStarted || video.dataset.timerArmed === "true") return;
        video.dataset.timerArmed = "true";

        const startTimer = () => {
          if (
            state.remoteOutputStarted
            || !state.live
            || !video.isConnected
            || video.readyState < HTMLMediaElement.HAVE_CURRENT_DATA
            || !video.videoWidth
            || !video.videoHeight
          ) {
            return;
          }
          state.remoteOutputStarted = true;
          scheduleAutoHangup();
        };

        if (typeof video.requestVideoFrameCallback === "function") {
          video.requestVideoFrameCallback(startTimer);
          return;
        }
        video.addEventListener("loadeddata", startTimer, { once: true });
        video.addEventListener("playing", startTimer, { once: true });
      }

      async function resetSessionState() {
        clearAutoHangupTimer();
        clearConnInitRetry();
        closeAppSocket();
        await stopRemoteRecording();
        stopInputDelayBuffer();
        await cleanupRtc();
        state.activeProvider = undefined;
        state.live = null;
        state.rtc = null;
        state.clientSecret = "";
        state.renderUid = "";
        state.remoteOutputStarted = false;
        sessionData.dataset.emptySession = "true";
        sessionData.textContent = t("session.empty");
        clearMediaNotice();
        setInteractiveEnabled(false);
        setStatus("#apiStatus", "status.apiIdle", "warn");
        setStatus("#wsStatus", "status.wsIdle", "warn");
      }

      function closeAppSocket() {
        if (!state.appSocket) {
          return;
        }
        if (state.appSocket.readyState === WebSocket.OPEN || state.appSocket.readyState === WebSocket.CONNECTING) {
          state.appSocket.close();
        }
        state.appSocket = undefined;
      }

      function cleanupDecart() {
        state.falConnection?.close();
        state.falConnection = undefined;
        state.decartPeerConnection?.close();
        state.decartPeerConnection = undefined;
        state.decartInputStream?.getTracks().forEach((track) => track.stop());
        state.decartInputStream = undefined;
      }

      async function cleanupRtc() {
        cleanupDecart();
        for (const key of [...state.remoteVideoElMap.keys()]) {
          const [type, userId] = key.split("_");
          removeRemoteVideo(userId, type);
        }
        if (!state.aliRtcEngine) {
          await stopSegmentationProcessing();
          stopUploadedVideoCapture();
          return;
        }
        try {
          await callOptionalEngineMethod(state.aliRtcEngine, "stopPreview");
          await callOptionalEngineMethod(state.aliRtcEngine, "leaveChannel");
        } catch (error) {
          log(t("log.rtcCleanupFailed"), errorToJson(error));
        } finally {
          state.aliRtcEngine.destroy();
          state.aliRtcEngine = undefined;
          await stopSegmentationProcessing();
          stopUploadedVideoCapture();
          setStatus("#rtcStatus", "status.rtcIdle", "warn");
        }
      }

      async function hangup() {
        hangupBtn.disabled = true;
        try {
          await stopRemoteRecording({ download: true });
        } catch (error) {
          log(t("error.recordingFailed"), errorToJson(error));
        }
        if (state.activeProvider === "vidu") {
          try {
            sendAppSignal(
              {
                type: 5,
                live_id: String(state.live.id),
                conn_id: state.connId,
                seq_id: state.seqId++,
                payload: { hangup: { hangup_reason: "user_hangup" } },
              },
              "App WS call_hangup",
            );
          } catch (error) {
            log(t("log.hangupSignalFailed"), errorToJson(error));
          }
        }
        await resetSessionState();
        hangupBtn.disabled = true;
        joinBtn.disabled = false;
        setSourceControlsDisabled(false);
        queueLocalInputPreviewRefresh();
      }

      function safeJson(value) {
        try {
          return JSON.parse(value);
        } catch {
          return undefined;
        }
      }

      function errorToJson(error) {
        return {
          name: error?.name,
          message: error?.message || String(error),
          stack: error?.stack,
        };
      }

      /* ---------- 启动 ---------- */
      bindImageTabs("");
      bindImageTabs("sw");
      bindSamplePicker("");
      bindSamplePicker("sw");
      selectDefaultSample();
      applyLanguage(detectInitialLanguage());
      restoreApiKey();
      updateSessionDurationOutput();
      state.connId = newConnectionId();

      $("#authToken").addEventListener("input", persistApiKey);
      $("#sessionDuration").addEventListener("input", updateSessionDurationOutput);
      document.querySelectorAll('input[name="provider"]').forEach((input) => {
        input.addEventListener("change", () => {
          updateProviderUi();
          restoreApiKey();
          clearMediaNotice();
        });
      });

      joinBtn.addEventListener("click", async () => {
        try {
          validateVideoInput();
        } catch (error) {
          showNotice(error.message || String(error));
          return;
        }
        joinBtn.disabled = true;
        hangupBtn.disabled = false;
        setSourceControlsDisabled(true);
        try {
          await state.localPreviewRefreshPromise.catch(() => {});
          await resetSessionState();
          if (selectedProvider() === "decart") {
            await startDecartSession();
          } else {
            state.activeProvider = "vidu";
            await createStream();
            connectAppWebSocket();
            log("waiting conn_init_ack (NOT_READY auto-retries)");
            await waitForConnInitAck();
            startInputDelayBuffer();
            await joinAliRtc();
          }
        } catch (error) {
          clearAutoHangupTimer();
          stopInputDelayBuffer();
          log(t("log.startFailed"), errorToJson(error));
          setStatus("#apiStatus", "status.apiFailed", "warn");
          setStatus("#rtcStatus", "status.rtcFailed", "warn");
          hangupBtn.disabled = true;
          joinBtn.disabled = false;
          setSourceControlsDisabled(false);
          await cleanupRtc();
          closeAppSocket();
          queueLocalInputPreviewRefresh();
        }
      });

      hangupBtn.addEventListener("click", () => {
        hangup().catch((error) => log(t("log.hangupFailed"), errorToJson(error)));
      });

      clearBtn.addEventListener("click", () => {
        eventLog.textContent = "";
      });

      switchBtn.addEventListener("click", sendSwitchPrompt);
    </script>
  </body>
</html>
