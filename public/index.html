<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Live Editing Stream Demo</title>
    <script src="https://g.alicdn.com/apsara-media-box/imp-web-rtc/7.1.9/aliyun-rtc-sdk.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-backend-webgpu@4.22.0/dist/tf-backend-webgpu.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/body-segmentation@1.0.2/dist/body-segmentation.min.js" crossorigin="anonymous"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;700&family=Sora:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        color-scheme: light;
        --bg: #eef1f7;
        --panel: #ffffff;
        --panel-hi: #f7f9fc;
        --border: #dfe5ee;
        --border-soft: #e8edf5;
        --text: #111a2c;
        --muted: #64748b;
        --accent: #0d9488;
        --accent-2: #0284c7;
        --accent-ink: #ffffff;
        --ok: #0e9f6e;
        --ok-bg: rgba(14, 159, 110, 0.09);
        --warn: #b45309;
        --warn-bg: rgba(217, 119, 6, 0.1);
        --err: #dc2626;
        --err-bg: rgba(220, 38, 38, 0.08);
        --font-ui: "Sora", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
        --font-body: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
        --font-mono: "IBM Plex Mono", "Noto Sans SC", ui-monospace, SFMono-Regular, Menlo, monospace;
      }

      * {
        scrollbar-width: thin;
        scrollbar-color: #c2cbda transparent;
      }

      body {
        margin: 0;
        background:
          radial-gradient(1100px 520px at 85% -10%, rgba(13, 148, 136, 0.1), transparent 60%),
          radial-gradient(900px 520px at -10% 25%, rgba(2, 132, 199, 0.08), transparent 55%),
          var(--bg);
        color: var(--text);
        font-family: var(--font-body);
        font-size: 14px;
        overflow-x: hidden;
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        background-image:
          linear-gradient(rgba(15, 23, 42, 0.035) 1px, transparent 1px),
          linear-gradient(90deg, rgba(15, 23, 42, 0.035) 1px, transparent 1px);
        background-size: 44px 44px;
        mask-image: radial-gradient(ellipse 80% 60% at 50% 0%, black 0%, transparent 75%);
        -webkit-mask-image: radial-gradient(ellipse 80% 60% at 50% 0%, black 0%, transparent 75%);
      }

      ::selection {
        background: rgba(13, 148, 136, 0.22);
      }

      main {
        max-width: 1280px;
        margin: 0 auto;
        padding: 26px 24px 48px;
        box-sizing: border-box;
        position: relative;
      }

      main > * {
        animation: rise 0.55s cubic-bezier(0.22, 0.8, 0.32, 1) both;
      }

      main > *:nth-child(2) { animation-delay: 0.06s; }
      main > *:nth-child(3) { animation-delay: 0.1s; }
      main > *:nth-child(4) { animation-delay: 0.16s; }

      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(14px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }

      h1 {
        margin: 14px 0 8px;
        font-family: var(--font-ui);
        font-size: 28px;
        font-weight: 800;
        letter-spacing: -0.02em;
        display: flex;
        align-items: center;
        gap: 12px;
      }

      h1::before {
        content: "";
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--err);
        box-shadow: 0 0 12px rgba(248, 113, 113, 0.9);
        flex: none;
        animation: pulse 1.8s ease-in-out infinite;
      }

      h2 {
        font-family: var(--font-ui);
        letter-spacing: -0.01em;
      }

      strong {
        font-family: var(--font-ui);
        font-size: 13px;
      }

      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.35; }
      }

      .hint {
        margin: 0 0 22px;
        color: var(--muted);
        line-height: 1.7;
        font-size: 13px;
        max-width: 76ch;
      }

      code {
        font-family: var(--font-mono);
        font-size: 0.88em;
        background: #ecf8f6;
        border: 1px solid #c9e8e4;
        border-radius: 5px;
        padding: 1px 6px;
        color: #0f766e;
      }

      .layout {
        display: grid;
        grid-template-columns: minmax(340px, 396px) minmax(0, 1fr);
        gap: 20px;
        align-items: start;
      }

      .card {
        position: relative;
        border: 1px solid var(--border);
        border-radius: 14px;
        background: linear-gradient(180deg, var(--panel-hi) 0%, var(--panel) 55%);
        padding: 20px;
        box-shadow:
          0 20px 40px -24px rgba(16, 24, 40, 0.22),
          0 1px 3px rgba(16, 24, 40, 0.05);
        min-width: 0;
        max-width: 100%;
      }

      .card::before {
        content: "";
        position: absolute;
        top: 0;
        left: 8%;
        right: 8%;
        height: 1px;
        background: linear-gradient(90deg, transparent, rgba(13, 148, 136, 0.35), transparent);
        pointer-events: none;
      }

      label {
        display: block;
        margin: 16px 0 7px;
        font-family: var(--font-mono);
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.09em;
        text-transform: uppercase;
        color: var(--muted);
      }

      .toolbar {
        align-items: center;
        gap: 10px;
        padding: 6px 12px;
        border: 1px solid var(--border);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.75);
        backdrop-filter: blur(6px);
        box-shadow: 0 1px 3px rgba(16, 24, 40, 0.06);
      }

      .toolbar label {
        margin: 0;
      }

      .toolbar select {
        background: transparent;
        border-color: transparent;
        border-radius: 999px;
        padding: 4px 8px;
        font-family: var(--font-mono);
        font-size: 12px;
        color: var(--accent);
      }

      input,
      select,
      textarea,
      button {
        box-sizing: border-box;
        width: 100%;
        border: 1px solid var(--border);
        border-radius: 9px;
        padding: 10px 12px;
        font: inherit;
        font-size: 13px;
        background: #f8fafc;
        color: var(--text);
        transition: border-color 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
      }

      select {
        cursor: pointer;
      }

      input::placeholder {
        color: #97a3b7;
      }

      input:focus-visible,
      select:focus-visible,
      textarea:focus-visible {
        outline: none;
        border-color: var(--accent);
        background: #ffffff;
        box-shadow: 0 0 0 3px rgba(13, 148, 136, 0.14);
      }

      button {
        cursor: pointer;
        border-color: transparent;
        background: linear-gradient(135deg, var(--accent), var(--accent-2));
        color: var(--accent-ink);
        font-family: var(--font-ui);
        font-weight: 700;
        letter-spacing: 0.02em;
        box-shadow: 0 8px 20px -10px rgba(13, 148, 136, 0.55);
      }

      button:hover:not(:disabled) {
        transform: translateY(-1px);
        filter: brightness(1.08);
      }

      button:active:not(:disabled) {
        transform: translateY(0) scale(0.99);
        filter: brightness(0.96);
      }

      button.secondary {
        border-color: #cbd5e1;
        background: #ffffff;
        color: var(--text);
        box-shadow: none;
      }

      button.secondary:hover:not(:disabled) {
        border-color: rgba(13, 148, 136, 0.5);
        color: var(--accent);
        filter: none;
      }

      button.danger {
        border-color: rgba(220, 38, 38, 0.4);
        background: rgba(220, 38, 38, 0.07);
        color: #dc2626;
        box-shadow: none;
      }

      button.danger:hover:not(:disabled) {
        background: #dc2626;
        border-color: #dc2626;
        color: #ffffff;
        filter: none;
      }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.45;
        transform: none;
        filter: none;
        box-shadow: none;
      }

      .actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin-top: 18px;
      }

      .status-row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin: 14px 0;
      }

      .pill {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        border-radius: 999px;
        border: 1px solid rgba(14, 159, 110, 0.3);
        background: var(--ok-bg);
        color: var(--ok);
        font-family: var(--font-mono);
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        padding: 5px 12px;
        transition: color 0.25s ease, border-color 0.25s ease, background 0.25s ease;
      }

      .pill::before {
        content: "";
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: currentColor;
        box-shadow: 0 0 8px currentColor;
        flex: none;
      }

      .pill.warn {
        border-color: rgba(180, 83, 9, 0.3);
        background: var(--warn-bg);
        color: var(--warn);
      }

      .pill.err {
        border-color: rgba(220, 38, 38, 0.35);
        background: var(--err-bg);
        color: var(--err);
      }

      .notice {
        display: none;
        margin: 10px 0;
        padding: 10px 14px;
        border-radius: 9px;
        border-left: 3px solid var(--err);
        background: var(--err-bg);
        color: #b91c1c;
        font-size: 13px;
        line-height: 1.6;
      }

      .img-tabs {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(72px, 1fr));
        gap: 4px;
        margin: 6px 0 8px;
        padding: 4px;
        border: 1px solid var(--border-soft);
        border-radius: 11px;
        background: #eef1f6;
      }

      .img-tab {
        border: 1px solid transparent;
        background: transparent;
        color: var(--muted);
        font-family: var(--font-mono);
        font-size: 12px;
        font-weight: 500;
        border-radius: 8px;
        padding: 7px 8px;
        box-shadow: none;
      }

      .img-tab:hover:not(.active):not(:disabled) {
        color: var(--text);
        filter: none;
      }

      .img-tab.active {
        border-color: rgba(13, 148, 136, 0.35);
        background: #ffffff;
        color: var(--accent);
        box-shadow: 0 1px 3px rgba(16, 24, 40, 0.08);
      }

      .effect-segments {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 4px;
        padding: 4px;
        border: 1px solid var(--border-soft);
        border-radius: 11px;
        background: #eef1f6;
      }

      .effect-segments label {
        position: relative;
        margin: 0;
        cursor: pointer;
      }

      .effect-segments input {
        position: absolute;
        width: 1px;
        height: 1px;
        opacity: 0;
        pointer-events: none;
      }

      .effect-segments span {
        display: block;
        padding: 9px 12px;
        border: 1px solid transparent;
        border-radius: 8px;
        color: var(--muted);
        font-family: var(--font-ui);
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0;
        text-align: center;
        text-transform: none;
      }

      .effect-segments input:checked + span {
        border-color: rgba(13, 148, 136, 0.35);
        background: #ffffff;
        color: var(--accent);
        box-shadow: 0 1px 3px rgba(16, 24, 40, 0.08);
      }

      .effect-segments input:focus-visible + span {
        outline: 3px solid rgba(13, 148, 136, 0.14);
        outline-offset: 1px;
      }

      .effect-segments input:disabled + span {
        cursor: not-allowed;
        opacity: 0.5;
      }

      input[type="file"] {
        cursor: pointer;
      }

      input[type="file"]::file-selector-button {
        cursor: pointer;
        font-family: var(--font-mono);
        font-size: 12px;
        font-weight: 600;
        color: var(--accent);
        background: rgba(13, 148, 136, 0.09);
        border: 1px solid rgba(13, 148, 136, 0.35);
        border-radius: 7px;
        padding: 6px 12px;
        margin-right: 10px;
        transition: background 0.18s ease;
      }

      input[type="file"]::file-selector-button:hover {
        background: rgba(13, 148, 136, 0.16);
      }

      .img-preview {
        margin-top: 8px;
        width: 100%;
        aspect-ratio: 16 / 9;
        object-fit: contain;
        border: 1px dashed var(--border);
        border-radius: 9px;
        background: #f1f4f9;
        display: none;
      }

      .sample-picker {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(82px, 1fr));
        gap: 8px;
        margin-top: 8px;
      }

      .sample-character {
        padding: 5px;
        border: 1px solid var(--border);
        background: #ffffff;
        color: var(--muted);
        box-shadow: none;
        font-family: var(--font-mono);
        font-size: 10px;
        font-weight: 600;
        line-height: 1.25;
      }

      .sample-character:hover:not(:disabled) {
        border-color: rgba(13, 148, 136, 0.5);
        color: var(--accent);
        filter: none;
      }

      .sample-character.selected {
        border-color: var(--accent);
        color: var(--accent);
        box-shadow: 0 0 0 2px rgba(13, 148, 136, 0.14);
      }

      .sample-character img {
        display: block;
        width: 100%;
        aspect-ratio: 1;
        margin-bottom: 5px;
        border-radius: 6px;
        object-fit: cover;
        background: #eef1f6;
      }

      .source-pane {
        margin-top: 8px;
      }

      .segmentation-controls {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-top: 10px;
        padding: 10px 12px;
        border: 1px solid var(--border-soft);
        border-radius: 9px;
        background: #f8fafc;
      }

      .segmentation-controls label {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 0;
        text-transform: none;
        letter-spacing: 0;
        font-family: var(--font-body);
        font-size: 12px;
        cursor: pointer;
      }

      .segmentation-controls input[type="checkbox"] {
        width: 16px;
        height: 16px;
        margin: 0;
        padding: 0;
        accent-color: var(--accent);
      }

      .segmentation-controls input[type="color"] {
        width: 38px;
        height: 30px;
        padding: 3px;
        cursor: pointer;
      }

      .duration-control {
        display: grid;
        grid-template-columns: auto 1fr auto;
        align-items: center;
        gap: 10px;
        margin-top: 10px;
        padding: 10px 12px;
        border: 1px solid var(--border-soft);
        border-radius: 9px;
        background: #f8fafc;
      }

      .duration-control label {
        margin: 0;
        text-transform: none;
        letter-spacing: 0;
        font-family: var(--font-body);
        font-size: 12px;
      }

      .duration-control input[type="range"] {
        width: 100%;
        padding: 0;
        border: 0;
        accent-color: var(--accent);
        cursor: pointer;
      }

      .duration-control output {
        min-width: 42px;
        color: var(--accent);
        font-family: var(--font-mono);
        font-size: 12px;
        font-weight: 700;
        text-align: right;
      }

      .capture-source {
        position: fixed !important;
        inset: auto auto auto -10000px !important;
        width: 1px !important;
        height: 1px !important;
        opacity: 0;
        pointer-events: none;
      }

      .video-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
      }

      .video-box {
        border: 1px solid var(--border);
        border-radius: 12px;
        overflow: hidden;
        background: #ffffff;
        box-shadow: 0 1px 3px rgba(16, 24, 40, 0.06);
      }

      .video-title {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 12px;
        font-family: var(--font-mono);
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--muted);
        background: #f6f8fb;
        border-bottom: 1px solid var(--border-soft);
      }

      .video-title::before {
        content: "";
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--err);
        box-shadow: 0 0 8px rgba(248, 113, 113, 0.9);
        flex: none;
        animation: pulse 1.8s ease-in-out infinite;
      }

      .video-stage {
        position: relative;
        aspect-ratio: 16 / 9;
        background: #0b0f16;
      }

      .video-stage:empty::before {
        content: "NO SIGNAL";
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        font-family: var(--font-mono);
        font-size: 11px;
        letter-spacing: 0.4em;
        text-indent: 0.4em;
        color: #3d4a63;
        background:
          repeating-linear-gradient(
            -55deg,
            rgba(148, 163, 184, 0.06) 0 2px,
            transparent 2px 14px
          );
      }

      .video-stage video {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
        background: #000;
      }

      pre {
        margin: 8px 0 0;
        max-height: 320px;
        overflow: auto;
        background: #f6f8fb;
        color: #15664a;
        border: 1px solid var(--border-soft);
        border-radius: 10px;
        padding: 12px 14px;
        font-family: var(--font-mono);
        font-size: 12px;
        line-height: 1.65;
        white-space: pre-wrap;
        word-break: break-all;
      }

      pre::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }

      pre::-webkit-scrollbar-thumb {
        background: #c2cbda;
        border-radius: 4px;
      }

      pre::-webkit-scrollbar-track {
        background: transparent;
      }

      .field-hint {
        margin-top: 5px;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.6;
      }

      @media (max-width: 1080px) {
        .layout {
          grid-template-columns: 1fr;
        }
      }

      @media (max-width: 900px) {
        main {
          padding: 14px 12px 32px;
        }

        h1 {
          font-size: 22px;
        }

        .video-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1 data-i18n="page.title">实时编辑直播流 Demo</h1>

      <div class="layout">
        <section class="card">
          <div class="actions">
            <button id="joinBtn" data-i18n="button.join">创建并连接</button>
            <button id="hangupBtn" class="danger" disabled data-i18n="button.hangup">挂断</button>
          </div>
          <div class="status-row">
            <span id="apiStatus" class="pill warn">API idle</span>
            <span id="wsStatus" class="pill warn">WS idle</span>
            <span id="rtcStatus" class="pill warn">RTC idle</span>
          </div>

          <label data-i18n="field.provider">提供商</label>
          <div class="effect-segments" role="radiogroup" aria-label="Provider">
            <label>
              <input type="radio" name="provider" value="vidu" checked />
              <span>Vidu</span>
            </label>
            <label>
              <input type="radio" name="provider" value="decart" />
              <span>Decart</span>
            </label>
          </div>

          <label id="authTokenLabel" for="authToken">Vidu API Key（vda_...）</label>
          <input id="authToken" placeholder="vda_..." autocomplete="off" />
          <div id="apiKeyHint" class="field-hint" data-i18n="field.apiKeyHint">仅保存在当前浏览器的本地存储中。</div>

          <label data-i18n="field.referenceImage">参考图（编辑用，必填）</label>
          <div class="img-tabs">
            <button type="button" class="img-tab" data-itab="url" data-i18n="tab.imageUrl">图片 URL</button>
            <button type="button" class="img-tab" data-itab="file" data-i18n="tab.imageFile">本地选图</button>
            <button type="button" class="img-tab active" data-itab="sample" data-i18n="tab.sampleCharacter">示例角色</button>
          </div>
          <input id="imageUrl" placeholder="https://example.com/reference.png" spellcheck="false" data-pane="url" style="display: none" />
          <div data-pane="file" style="display: none">
            <input id="imageFile" type="file" accept="image/*" />
          </div>
          <div data-pane="sample">
            <div id="samplePicker" class="sample-picker"></div>
          </div>
          <img id="imagePreview" class="img-preview" alt="preview" />

          <label data-i18n="field.editingType">编辑效果</label>
          <div class="effect-segments" role="radiogroup" aria-label="Editing effect">
            <label>
              <input type="radio" name="editingType" value="style_transfer" checked />
              <span data-i18n="editing.style">风格</span>
            </label>
            <label>
              <input type="radio" name="editingType" value="subject_replacement" />
              <span data-i18n="editing.subject">主体</span>
            </label>
          </div>

          <label for="videoSource" data-i18n="field.videoSource">视频输入</label>
          <select id="videoSource">
            <option value="camera" selected data-i18n="videoSource.camera">摄像头 + 麦克风</option>
            <option value="file" data-i18n="videoSource.file">上传的视频</option>
          </select>
          <div id="videoFilePane" class="source-pane" style="display: none">
            <input id="videoFile" type="file" accept="video/*" />
            <div class="field-hint" data-i18n="field.videoFileHint">连接后视频会自动循环播放并作为编辑输入；不会使用摄像头或麦克风。</div>

      function readFileAsDataURL(file, sizeLimitBytes) {
        return new Promise((resolve, reject) => {
          if (file.size > sizeLimitBytes) {
            reject(new Error("too large"));
            return;
          }
          const reader = new FileReader();
          reader.onload = () => resolve(String(reader.result || ""));
          reader.onerror = () => reject(reader.error || new Error("read failed"));
          reader.readAsDataURL(file);
        });
      }

      function isUploadedVideoSelected() {

      function validateVideoInput() {
        if (isSegmentationEnabled()) {
          if (!navigator.gpu || !window.tf || !window.bodySegmentation) {
            throw new Error(t("error.segmentationUnavailable"));
          }
          if (typeof segmentationCanvas.captureStream !== "function") {
            throw new Error(t("error.videoCaptureUnsupported"));
          }
        }
        if (!isUploadedVideoSelected()) {
          return;
        }
        if (!$("#videoFile").files?.[0]) {
          throw new Error(t("error.videoFileRequired"));
        }
        const canCaptureVideo = typeof uploadedVideoSource.captureStream === "function" || typeof uploadedVideoSource.mozCaptureStream === "function";
        if (!canCaptureVideo && typeof uploadedVideoCanvas.captureStream !== "function") {
          throw new Error(t("error.videoCaptureUnsupported"));
        }
      }

      function stopUploadedVideoCapture() {
        if (state.uploadedVideoDrawFrame) {
          window.cancelAnimationFrame(state.uploadedVideoDrawFrame);
          state.uploadedVideoDrawFrame = undefined;
        }
        state.uploadedCaptureStream?.getTracks().forEach((track) => track.stop());
        state.uploadedCaptureStream = undefined;
        uploadedVideoSource.pause();
        uploadedVideoSource.removeAttribute("src");
        uploadedVideoSource.load();
      }

      function clearVideoObjectUrl() {
        if (state.videoObjectUrl) {
          URL.revokeObjectURL(state.videoObjectUrl);
          state.videoObjectUrl = "";
        }
      }

      function waitForVideoReady(video) {
        if (video.readyState >= HTMLMediaElement.HAVE_CURRENT_DATA) {
          return Promise.resolve();
        }
        return new Promise((resolve, reject) => {
          const cleanup = () => {
            video.removeEventListener("loadeddata", onReady);
            video.removeEventListener("error", onError);
          };
          const onReady = () => {
            cleanup();
            resolve();
          };
          const onError = () => {
            cleanup();
            reject(new Error(t("error.videoLoadFailed")));
          };
          video.addEventListener("loadeddata", onReady, { once: true });
          video.addEventListener("error", onError, { once: true });
        });
      }

      async function previewUploadedVideo(file) {
        stopUploadedVideoCapture();
        clearVideoObjectUrl();
        state.videoObjectUrl = URL.createObjectURL(file);
        localPreviewer.srcObject = null;
        localPreviewer.src = state.videoObjectUrl;
        localPreviewer.loop = true;
        localPreviewer.muted = true;
        await waitForVideoReady(localPreviewer);
        await localPreviewer.play();
      }

      async function prepareUploadedVideoCapture() {
        const file = await prepareUploadedVideoElement();
        const captureStream = uploadedVideoSource.captureStream || uploadedVideoSource.mozCaptureStream;
        if (typeof captureStream === "function") {
          state.uploadedCaptureStream = captureStream.call(uploadedVideoSource);
        } else if (typeof uploadedVideoCanvas.captureStream === "function") {
          uploadedVideoCanvas.width = uploadedVideoSource.videoWidth;
          uploadedVideoCanvas.height = uploadedVideoSource.videoHeight;
          const context = uploadedVideoCanvas.getContext("2d", { alpha: false });
          const drawFrame = () => {
            context.drawImage(uploadedVideoSource, 0, 0, uploadedVideoCanvas.width, uploadedVideoCanvas.height);
            state.uploadedVideoDrawFrame = window.requestAnimationFrame(drawFrame);
          };
          drawFrame();
          state.uploadedCaptureStream = uploadedVideoCanvas.captureStream(30);
        } else {
          throw new Error(t("error.videoCaptureUnsupported"));
        }
        if (!state.uploadedCaptureStream.getVideoTracks().length) {
          stopUploadedVideoCapture();
          throw new Error(t("error.videoTrackMissing"));
        }
        log(t("log.videoInputReady"), { name: file.name, type: file.type, size: file.size });
      }

      async function prepareUploadedVideoElement() {
        const file = $("#videoFile").files?.[0];
        if (!file) {
          throw new Error(t("error.videoFileRequired"));
        }
        stopUploadedVideoCapture();
        if (!state.videoObjectUrl) {
          state.videoObjectUrl = URL.createObjectURL(file);
        }
        uploadedVideoSource.src = state.videoObjectUrl;
        uploadedVideoSource.currentTime = 0;
        await waitForVideoReady(uploadedVideoSource);
        await uploadedVideoSource.play();
        return file;
      }

      async function withUploadedVideoAsCamera(callback) {
        await prepareUploadedVideoCapture();
        const mediaDevices = navigator.mediaDevices;
        const originalGetUserMedia = mediaDevices?.getUserMedia;
        if (!originalGetUserMedia) {
          throw new Error(t("error.videoCaptureUnsupported"));
        }
        mediaDevices.getUserMedia = async function (constraints) {
          if (!constraints?.video) {
            return originalGetUserMedia.call(mediaDevices, constraints);
          }
          const videoTrack = state.uploadedCaptureStream?.getVideoTracks()[0];
          if (!videoTrack || videoTrack.readyState === "ended") {
            throw new Error(t("error.videoTrackMissing"));
          }
          return new MediaStream([videoTrack.clone()]);
        };
        try {
          return await callback();
        } finally {
          mediaDevices.getUserMedia = originalGetUserMedia;
        }
      }

      async function stopSegmentationProcessing() {
        state.segmentationRunning = false;
        if (state.segmentationFrameRequest) {
          window.cancelAnimationFrame(state.segmentationFrameRequest);
          state.segmentationFrameRequest = undefined;
        }
        state.segmentedCaptureStream?.getTracks().forEach((track) => track.stop());
        state.segmentedCaptureStream = undefined;
        state.segmentationRawStream?.getTracks().forEach((track) => track.stop());
        state.segmentationRawStream = undefined;
        segmentationVideoSource.pause();
        segmentationVideoSource.srcObject = null;
        if (state.segmentationProcessor) {
          try {
            await state.segmentationProcessor.dispose();
          } catch (_error) {
            // The model may already be disposed after its source track ends.
          }
          state.segmentationProcessor = undefined;
          log(t("log.segmentationStopped"));
        }
      }

      async function startSegmentationProcessing(sourceVideo) {
        if (!navigator.gpu || !window.tf || !window.bodySegmentation) {
          throw new Error(t("error.segmentationUnavailable"));
        }
        if (typeof segmentationCanvas.captureStream !== "function") {
          throw new Error(t("error.videoCaptureUnsupported"));
        }

        const width = sourceVideo.videoWidth || 1280;
        const height = sourceVideo.videoHeight || 720;
        // The TFJS mask wrapper uses the element's declared dimensions when it
        // constructs its output, not only videoWidth/videoHeight.
        if (sourceVideo instanceof HTMLVideoElement) {
          sourceVideo.width = width;
          sourceVideo.height = height;
        }
        segmentationCanvas.width = width;
        segmentationCanvas.height = height;
        // Compositing requires a transparent intermediate foreground. An opaque
        // backing store makes source-in retain the entire original image.
        const context = segmentationCanvas.getContext("2d", { alpha: true });
        const maskCanvas = document.createElement("canvas");
        maskCanvas.width = width;
        maskCanvas.height = height;
        const maskContext = maskCanvas.getContext("2d");
        context.fillStyle = $("#segmentationBackgroundColor").value;
        context.fillRect(0, 0, width, height);

        await window.tf.setBackend("webgpu");
        await window.tf.ready();
        if (window.tf.getBackend() !== "webgpu") {
          throw new Error("WebGPU initialization failed; segmentation requires the WebGPU backend.");
        }
        const processor = await window.bodySegmentation.createSegmenter(
          window.bodySegmentation.SupportedModels.MediaPipeSelfieSegmentation,
          {
            runtime: "tfjs",
            modelType: "landscape",
          },
        );
        state.segmentationProcessor = processor;
        state.segmentedCaptureStream = segmentationCanvas.captureStream(30);
        state.segmentationRunning = true;

        const renderSegmentation = async () => {
          const people = await processor.segmentPeople(sourceVideo, { flipHorizontal: false });
          const personMask = people[0]?.mask;
          if (!personMask) throw new Error("The WebGPU segmenter returned no person mask.");
          const maskTensor = await personMask.toTensor();
          const dimensions = maskTensor.shape;
          const maskHeight = dimensions[0];
          const maskWidth = dimensions[1];
          const maskChannels = dimensions[2] || 1;
          if (!maskWidth || !maskHeight) {
            maskTensor.dispose();
            throw new Error(`The WebGPU segmenter returned an invalid mask size: ${JSON.stringify(dimensions)}.`);
          }
          const confidenceValues = await maskTensor.data();
          maskTensor.dispose();
          if (maskCanvas.width !== maskWidth || maskCanvas.height !== maskHeight) {
            maskCanvas.width = maskWidth;
            maskCanvas.height = maskHeight;
          }
          const maskImage = maskContext.createImageData(maskWidth, maskHeight);
          for (let pixel = 0; pixel < maskWidth * maskHeight; pixel += 1) {
            const offset = pixel * 4;
            const rawConfidence = maskChannels >= 4
              ? confidenceValues[pixel * maskChannels + 3]
              : confidenceValues[pixel * maskChannels];
            const confidence = rawConfidence > 1 ? rawConfidence / 255 : rawConfidence;
            maskImage.data[offset] = 255;
            maskImage.data[offset + 1] = 255;
            maskImage.data[offset + 2] = 255;
            maskImage.data[offset + 3] = confidence <= 0.1
              ? 0
              : Math.min(255, Math.round((confidence - 0.1) * 255 / 0.9));
          }
          maskContext.putImageData(maskImage, 0, 0);

          context.save();
          context.clearRect(0, 0, width, height);
          context.drawImage(maskCanvas, 0, 0, width, height);
          context.globalCompositeOperation = "source-in";
          context.drawImage(sourceVideo, 0, 0, width, height);
          context.globalCompositeOperation = "destination-over";
          context.fillStyle = $("#segmentationBackgroundColor").value;
          context.fillRect(0, 0, width, height);
          context.restore();
        };

        let processingFrame = false;
        const processFrame = async () => {
          if (!state.segmentationRunning) {
            return;
          }
          if (!processingFrame && sourceVideo.readyState >= HTMLMediaElement.HAVE_CURRENT_DATA) {
            processingFrame = true;
            try {
              await renderSegmentation();
            } catch (error) {
              state.segmentationRunning = false;
              showNotice(`${t("error.segmentationFailed")}: ${error.message || String(error)}`);
              log(t("error.segmentationFailed"), errorToJson(error));
              return;
            } finally {
              processingFrame = false;
            }
          }
          state.segmentationFrameRequest = window.requestAnimationFrame(processFrame);
        };
        processFrame();
        log(t("log.segmentationReady"), {
          width,
          height,
          background: $("#segmentationBackgroundColor").value,
          backend: window.tf.getBackend(),
        });
      }

      async function withSegmentedVideoAsCamera(callback) {
        await stopSegmentationProcessing();
        const mediaDevices = navigator.mediaDevices;
        const originalGetUserMedia = mediaDevices?.getUserMedia;
        if (!originalGetUserMedia) {
          throw new Error(t("error.videoCaptureUnsupported"));
        }
        const useUploadedVideo = isUploadedVideoSelected();
        let initialized = false;
        mediaDevices.getUserMedia = async function (constraints) {
          if (!constraints?.video) {
            return originalGetUserMedia.call(mediaDevices, constraints);
          }
          if (!initialized) {
            let sourceVideo;
            if (useUploadedVideo) {
              await prepareUploadedVideoElement();
              sourceVideo = uploadedVideoSource;
            } else {
              state.segmentationRawStream = await originalGetUserMedia.call(mediaDevices, constraints);
              segmentationVideoSource.srcObject = state.segmentationRawStream;
              await segmentationVideoSource.play();
              await waitForVideoReady(segmentationVideoSource);
              sourceVideo = segmentationVideoSource;
            }
            await startSegmentationProcessing(sourceVideo);
            initialized = true;
          }
          const videoTrack = state.segmentedCaptureStream?.getVideoTracks()[0];
          if (!videoTrack || videoTrack.readyState === "ended") {
            throw new Error(t("error.videoTrackMissing"));
          }
          const tracks = [videoTrack.clone()];
          if (!useUploadedVideo && constraints.audio) {
            state.segmentationRawStream?.getAudioTracks().forEach((track) => tracks.push(track.clone()));
          }
          return new MediaStream(tracks);
        };
        try {
          return await callback();
        } finally {
          mediaDevices.getUserMedia = originalGetUserMedia;
        }
      }

      async function refreshLocalInputPreview() {
        await stopSegmentationProcessing();
        localPreviewer.pause();
        localPreviewer.srcObject = null;

        if (!isSegmentationEnabled()) {
          if (isUploadedVideoSelected()) {
            const file = $("#videoFile").files?.[0];
            if (file) await previewUploadedVideo(file);
          } else {
            localPreviewer.removeAttribute("src");
            localPreviewer.load();
          }
          return;
        }

        let sourceVideo;
        if (isUploadedVideoSelected()) {
          if (!$("#videoFile").files?.[0]) return;
          await prepareUploadedVideoElement();
          sourceVideo = uploadedVideoSource;
        } else {
          if (!navigator.mediaDevices?.getUserMedia) {
            throw new Error(t("error.videoCaptureUnsupported"));
          }
          state.segmentationRawStream = await navigator.mediaDevices.getUserMedia({
            video: { width: { ideal: 1280 }, height: { ideal: 720 } },
            audio: false,
          });
          segmentationVideoSource.srcObject = state.segmentationRawStream;
          await segmentationVideoSource.play();
          await waitForVideoReady(segmentationVideoSource);
          sourceVideo = segmentationVideoSource;
        }

        await startSegmentationProcessing(sourceVideo);
        localPreviewer.removeAttribute("src");
        localPreviewer.srcObject = state.segmentedCaptureStream;
        await localPreviewer.play();
      }

      function decartPrompt() {
        if (selectedEditingType() === "subject_replacement") {
          return "Replace the main subject with the character in the reference image while preserving the original motion, pose, lighting, and background.";
        }
        return "Change the style of the video to a high-quality anime illustration matching the reference image while preserving the original motion and composition.";
      }

      async function normalizeDecartReferenceImage(imageValue) {
        if (!imageValue.startsWith("data:")) return imageValue;
        const image = new Image();
        image.src = imageValue;
        await image.decode();
        if (image.naturalWidth >= 512 && image.naturalHeight >= 512) return imageValue;

        const canvas = document.createElement("canvas");
        canvas.width = 512;
        canvas.height = 512;
        const context = canvas.getContext("2d", { alpha: false });
        context.fillStyle = "#ffffff";
        context.fillRect(0, 0, 512, 512);
        const scale = Math.min(512 / image.naturalWidth, 512 / image.naturalHeight);
        const width = image.naturalWidth * scale;
        const height = image.naturalHeight * scale;
        context.drawImage(image, (512 - width) / 2, (512 - height) / 2, width, height);
        return canvas.toDataURL("image/jpeg", 0.92);
      }

      async function loadFalClient() {
        if (!state.falModulePromise) {
          state.falModulePromise = import(falClientCdnUrl).catch((error) => {

        return state.falModulePromise;

      async function prepareDecartInputStream() {
        const useUploadedVideo = isUploadedVideoSelected();
        const useSegmentation = isSegmentationEnabled();
        let stream;

        if (useUploadedVideo) {
          if (useSegmentation) {
            await prepareUploadedVideoElement();
            await startSegmentationProcessing(uploadedVideoSource);
            stream = state.segmentedCaptureStream;
          } else {
            await prepareUploadedVideoCapture();
            stream = state.uploadedCaptureStream;
          }
        } else if (useSegmentation) {
          state.segmentationRawStream = await navigator.mediaDevices.getUserMedia({
            video: { width: { ideal: 1280 }, height: { ideal: 720 }, frameRate: { ideal: 30 } },
            audio: false,
          });
          segmentationVideoSource.srcObject = state.segmentationRawStream;
          await segmentationVideoSource.play();
          await waitForVideoReady(segmentationVideoSource);
          await startSegmentationProcessing(segmentationVideoSource);
          stream = state.segmentedCaptureStream;
        } else {
          stream = await navigator.mediaDevices.getUserMedia({
            video: { width: { ideal: 1280 }, height: { ideal: 720 }, frameRate: { ideal: 30 } },
            audio: false,
          });
        }

        if (!stream?.getVideoTracks().length) {
          throw new Error(t("error.videoTrackMissing"));
        }
        state.decartInputStream = stream;
        localPreviewer.pause();
        localPreviewer.removeAttribute("src");
        localPreviewer.srcObject = stream;
        await localPreviewer.play();
        return stream;
      }

      function attachDecartRemoteStream(stream) {
        const key = "camera_decart";
        let video = state.remoteVideoElMap.get(key);
        if (!video) {
          video = document.createElement("video");
          video.autoplay = true;
          video.playsInline = true;
          video.muted = true;
          video.dataset.uid = "decart";
          remoteVideoContainer.textContent = "";
          remoteVideoContainer.appendChild(video);
          state.remoteVideoElMap.set(key, video);
          const startRecording = () => tryStartRemoteRecording(video);
          video.addEventListener("loadedmetadata", startRecording, { once: true });
          video.addEventListener("playing", startRecording, { once: true });
        }
        video.srcObject = stream;
        startTimerOnFirstRemoteFrame(video);
        video.play().then(() => tryStartRemoteRecording(video)).catch(() => log(t("log.remoteAutoplayFailed")));
      }

      async function startDecartSession() {
        const apiKey = stripAuthPrefix($("#authToken").value);
        if (!apiKey) throw new Error(t("error.apiKeyRequired"));
        await waitForActiveSample("");
        const selectedReferenceImage = activeImageValue("");
        if (!selectedReferenceImage) throw new Error(t("error.imageRequired"));
        const referenceImage = await normalizeDecartReferenceImage(selectedReferenceImage);

        state.activeProvider = "decart";
        const prompt = decartPrompt();
        const inputStream = await prepareDecartInputStream();
        const { fal } = await loadFalClient();
        fal.config({ credentials: apiKey });

        const sessionId = `decart-${Date.now()}`;
        state.live = { id: sessionId };
        sessionData.dataset.emptySession = "false";
        sessionData.textContent = JSON.stringify({
          provider: "Decart via fal.ai",
          endpoint: decartEndpoint,
          prompt,
          reference_image: referenceImage.startsWith("data:") ? "data URI" : referenceImage,
        }, null, 2);
        setStatus("#apiStatus", "status.apiCreating", "warn");
        setStatus("#wsStatus", "status.wsConnecting", "warn");
        setStatus("#rtcStatus", "status.rtcJoining", "warn");
        startInputDelayBuffer();

        await new Promise((resolve, reject) => {
          let settled = false;
          const timeout = window.setTimeout(() => {
            if (!settled) {
              settled = true;
              reject(new Error("Decart connection timed out"));
            }
          }, 9_000);
          const fail = (error) => {
            const normalized = error instanceof Error ? error : new Error(error?.message || String(error));
            if (!settled) {
              settled = true;
              window.clearTimeout(timeout);
              reject(normalized);
            } else {
              log("Decart connection error", errorToJson(normalized));
            }
          };
          const handleMessage = async (message) => {
            const type = String(message?.type || "").toLowerCase();
            if (type === "iceservers") {
              if (state.decartPeerConnection) return;
              const entries = message.iceservers ?? message.iceServers ?? message.ice_servers ?? [];
              const peer = new RTCPeerConnection({
                iceServers: entries.map((server) => ({
                  urls: server.urls,
                  username: server.username,
                  credential: server.credential,
                })),
              });
              state.decartPeerConnection = peer;
              inputStream.getVideoTracks().forEach((track) => peer.addTrack(track, inputStream));
              peer.ontrack = (event) => {
                const remoteStream = event.streams[0] || new MediaStream([event.track]);
                attachDecartRemoteStream(remoteStream);
                setStatus("#apiStatus", "status.apiLive", "ok", { id: "Decart" });
                setStatus("#wsStatus", "status.wsConnected", "ok");
                setStatus("#rtcStatus", "status.rtcJoined", "ok");
                if (!settled) {
                  settled = true;
                  window.clearTimeout(timeout);
                  resolve();
                }
              };
              peer.onicecandidate = (event) => {
                if (!event.candidate) return;
                state.falConnection?.send({
                  type: "icecandidate",
                  candidate: {
                    candidate: event.candidate.candidate,
                    sdpMid: event.candidate.sdpMid,
                    sdpMLineIndex: event.candidate.sdpMLineIndex,
                  },
                });
              };
              peer.onconnectionstatechange = () => {
                if (["failed", "closed"].includes(peer.connectionState) && !settled) {
                  fail(new Error(`Decart WebRTC ${peer.connectionState}`));
                }
              };
              const offer = await peer.createOffer();
              await peer.setLocalDescription(offer);
              state.falConnection?.send({ type: "offer", sdp: offer.sdp });
            } else if (type === "answer" && state.decartPeerConnection && message.sdp) {
              await state.decartPeerConnection.setRemoteDescription({ type: "answer", sdp: message.sdp });
            } else if (type === "icecandidate" && state.decartPeerConnection && message.candidate) {
              await state.decartPeerConnection.addIceCandidate(new RTCIceCandidate(message.candidate));
            } else if (type === "error") {
              fail(new Error(`Decart: ${message.error || "unknown error"}`));
            }
          };

          state.falConnection = fal.realtime.connect(decartEndpoint, {
            connectionKey: sessionId,
            throttleInterval: 0,
            onResult: (message) => handleMessage(message).catch(fail),
            onError: fail,
          });
          state.falConnection.send({
            prompt,
            reference_image_url: referenceImage,
            enable_prompt_expansion: true,
          });
        });
      }

      function buildConnInitSignal() {
        return {
          type: 1,
          live_id: String(state.live.id),
          conn_id: state.connId,
          seq_id: state.seqId++,
          payload: {
            conn_init: {
              version: 1,
            },
          },
        };
      }

      function scheduleConnInitRetry(delayMs = 2000) {
        clearConnInitRetry();
        state.connInitRetryTimer = window.setTimeout(() => {
          log(t("log.connInitRetry", { delayMs }));
          sendConnInit();
        }, delayMs);
      }

      function clearConnInitRetry() {
        if (state.connInitRetryTimer) {
          window.clearTimeout(state.connInitRetryTimer);
          state.connInitRetryTimer = undefined;
        }
      }

      function sendConnInit() {
        sendAppSignal(buildConnInitSignal());
      }

      function connectAppWebSocket() {
        if (!state.clientSecret) {
          throw new Error("Vidu did not return the client_secret required for a browser WebSocket connection");
        }
        const query = new URLSearchParams({
          live_id: String(state.live.id),
          conn_id: state.connId,
          client_secret: state.clientSecret,
        });
        const url = wsUrl(query);
        const safeQuery = new URLSearchParams({
          live_id: String(state.live.id),
          conn_id: state.connId,
          client_secret: "[redacted]",
        });
        log(t("log.connectAppWs"), { url: wsUrl(safeQuery) });
        state.appSocket = new WebSocket(url);
        setStatus("#wsStatus", "status.wsConnecting", "warn");

        state.appSocket.addEventListener("open", () => {
          setStatus("#wsStatus", "status.wsConnected", "ok");
          log(t("log.appWsConnected"));
          sendConnInit();
        });
        state.appSocket.addEventListener("message", (event) => {
          const payload = safeJson(event.data);
          log(t("log.appWsMessage"), payload ?? event.data);
          handleAppMessage(payload);
        });
        state.appSocket.addEventListener("close", (event) => {
          clearConnInitRetry();
          setStatus("#wsStatus", "status.wsClosed", "warn", { code: event.code });
          setInteractiveEnabled(false);
          log(t("log.appWsClosed"), { code: event.code, reason: event.reason });
        });
        state.appSocket.addEventListener("error", () => {
          setStatus("#wsStatus", "status.wsError", "warn");
          log(t("log.appWsError"));
        });
      }

      function waitForConnInitAck(timeoutMs = 120000) {
        return new Promise((resolve, reject) => {
          const socket = state.appSocket;
          if (!socket) {
            reject(new Error(t("error.appWsNotCreated")));
            return;
          }
          const timer = window.setTimeout(() => {
            cleanup();
            reject(new Error(t("error.connInitTimeout")));
          }, timeoutMs);
          const onMessage = (event) => {
            const payload = safeJson(event.data);
            const ack = payload?.payload?.conn_init_ack;
            if (payload?.type === 2 && ack) {
              if (ack.success) {
                cleanup();
                resolve(ack);
              } else if (ack.error_code !== "NOT_READY") {
                cleanup();
                reject(new Error(t("error.connInitFailed")));
              }
            }
          };
          const onClose = (event) => {
            cleanup();
            reject(new Error(t("error.appWsClosedEarly", { code: event.code })));
          };
          function cleanup() {
            window.clearTimeout(timer);
            socket.removeEventListener("message", onMessage);
            socket.removeEventListener("close", onClose);
          }
          socket.addEventListener("message", onMessage);
          socket.addEventListener("close", onClose);
        });
      }

      function handleAppMessage(payload) {
        if (!payload) {
          return;
        }
        const ack = payload.payload?.conn_init_ack;
        if (payload.type === 2 && ack) {
          if (ack.success) {
            clearConnInitRetry();
            setStatus("#wsStatus", "status.wsInitAck", "ok");
            setInteractiveEnabled(true);
          } else if (ack.error_code === "NOT_READY") {
            setStatus("#wsStatus", "status.wsNotReady", "warn");
            scheduleConnInitRetry(2000);
          } else {
            setStatus("#wsStatus", "status.wsInitFailed", "warn");
          }
        }
        const switchAck = payload.payload?.switch_prompt_ack;
        if (payload.type === 14 && switchAck && !switchAck.success) {
          setStatus("#wsStatus", "status.wsSwitchFailed", "err", { code: switchAck.error_code || "" });
          log(t("log.switchPromptFailed"), { error_code: switchAck.error_code, error_msg: switchAck.error_msg });
        }
        if (payload.type === 6) {
          setStatus("#wsStatus", "status.wsForceHangup", "warn");
          setInteractiveEnabled(false);
        }
      }

      function wsReadyError() {
        if (!state.live?.id) {
          return t("error.liveNotCreated");
        }
        if (!state.appSocket || state.appSocket.readyState !== WebSocket.OPEN) {
          return t("error.appWsNotReady");
        }
        return "";
      }

      function ensureWsReady(action) {
        const reason = wsReadyError();
        if (reason) {
          throw new Error(t("error.actionFailed", { action, reason }));
        }
      }

      function sendAppSignal(payload, label = t("log.sendAppMessage")) {
        ensureWsReady(label);
        state.appSocket.send(JSON.stringify(payload));
        log(label, payload);
      }

      /* ---------- 运行中换图 / 换场景 ---------- */
